[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "terralens"
version = "0.1.0"
description = "Interaktywny 3D eksplorator zmian powierzchni Ziemi (NASA GIBS/MODIS/SRTM + Satlas ESRGAN + PMTiles)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.24",
    "rich>=15",
    "rasterio>=1.4",
    "numpy>=2",
    "scikit-image>=0.25",
    "requests>=2.33",
    "python-dotenv>=1.2",
    "tqdm>=4.67",
    "pmtiles>=3.7",
    "pystac-client>=0.9",
    "boto3>=1.42",
    "torch>=2.6",
    "torchvision>=0.21",
    "satlaspretrain-models>=0.3",
    "Pillow>=12",
]

[project.scripts]
terralens = "terralens.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
